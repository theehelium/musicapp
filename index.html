<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicHub</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    /* HEADER */
    header{
      background:#111827;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      position:sticky;
      top:0;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
    }

    .search-box{
      margin-top:10px;
    }

    .search-box input{
      padding:12px;
      width:280px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    /* HERO SECTION */
    .hero{
      text-align:center;
      padding:60px 20px;
      background:linear-gradient(to right,#1e3a8a,#2563eb);
    }

    .hero h1{
      font-size:48px;
      margin-bottom:15px;
    }

    .hero p{
      font-size:18px;
      color:#e5e7eb;
    }

    /* MUSIC SECTION */
    .container{
      padding:40px 20px;
    }

    .section-title{
      font-size:30px;
      margin-bottom:25px;
      color:#38bdf8;
    }

    .music-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .music-card{
      background:#1e293b;
      border-radius:15px;
      overflow:hidden;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(0,0,0,0.4);
    }

    .music-card:hover{
      transform:translateY(-8px);
    }

    .music-card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .music-info{
      padding:18px;
    }

    .music-info h3{
      margin-bottom:10px;
      font-size:22px;
    }

    .artist{
      color:#94a3b8;
      margin-bottom:15px;
    }

    .play-btn{
      display:inline-block;
      padding:10px 18px;
      background:#38bdf8;
      color:white;
      text-decoration:none;
      border-radius:8px;
      transition:0.3s;
      border:none;
      cursor:pointer;
    }

    .play-btn:hover{
      background:#0ea5e9;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#111827;
      margin-top:40px;
      color:#94a3b8;
    }

    @media(max-width:600px){
      .hero h1{
        font-size:35px;
      }

      .search-box input{
        width:100%;
      }
    }
  </style>
</head>
