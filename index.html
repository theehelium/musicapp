<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MusicHub - One Audio at a Time</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      background:#111827;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      position:sticky;
      top:0;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
    }

    .search-box input{
      padding:12px;
      width:280px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    .hero{
      text-align:center;
      padding:60px 20px;
      background:linear-gradient(to right,#1e3a8a,#2563eb);
    }

    .hero h1{
      font-size:48px;
      margin-bottom:15px;
    }

    .hero p{
      font-size:18px;
      color:#e5e7eb;
    }

    .container{
      padding:40px 20px;
    }

    .section-title{
      font-size:30px;
      margin-bottom:25px;
      color:#38bdf8;
    }

    .music-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }

    .music-card{
      background:#1e293b;
      border-radius:15px;
      overflow:hidden;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(0,0,0,0.4);
      display:flex;
      flex-direction:column;
    }

    .music-card:hover{
      transform:translateY(-8px);
    }

    .music-card img{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
    }

    .music-info{
      padding:18px;
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .music-info h3{
      margin-bottom:8px;
      font-size:20px;
      line-height:1.3;
      min-height: 52px;
    }

    .artist{
      color:#94a3b8;
      margin-bottom:16px;
      font-size:14px;
      line-height:1.4;
      min-height: 40px;
    }

    audio{
      width:100%;
      margin:10px 0;
    }

    .play-btn{
      display:inline-block;
      padding:10px 18px;
      background:#38bdf8;
      color:white;
      text-decoration:none;
      border-radius:8px;
      transition:0.3s;
      border:none;
      cursor:pointer;
      text-align:center;
      margin-top:auto;
      align-self:flex-start;
    }

    .play-btn:hover{
      background:#0ea5e9;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#111827;
      margin-top:40px;
      color:#94a3b8;
    }

    @media(max-width:600px){
      .hero h1{
        font-size:35px;
      }
      .search-box input{
        width:100%;
      }
      .music-info h3, .artist{
        min-height: auto;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">MusicHub</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search songs or artists...">
  </div>
</header>

<section class="hero">
  <h1>Discover Music</h1>
  <p>Search your favorite songs and artists anytime</p>
</section>

<section class="container">
  <h2 class="section-title">Popular Songs</h2>
  <div class="music-grid" id="musicGrid">

    <!-- CARD 1 -->
    <div class="music-card">
      <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop" alt="music">
      <div class="music-info">
        <h3>2023 URBANIZED PARTY MIX</h3>
        <p class="artist">DJ BYRON WORLDWIDE ft. Sia, J. Bieber, J. Derulo, Ed Sheeran</p>
        <audio controls class="song-audio">
          <source src="https://res.cloudinary.com/dsedfuptl/video/upload/v1778191402/2023_URBANIZED_PARTY_MIX_-__DJ_BYRON_WORLDWIDE_BEATNATION_ft_Sia__J._Bieber__J._Derulo__Ed_Sheeran_128k_tph5a2.mp3" type="audio/mpeg">
        </audio>
        <button class="play-btn">Play Song</button>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="music-card">
      <img src="https://i.pinimg.com/736x/54/53/a4/5453a4c1c8656ddcdbb66d896d087179.jpg" alt="music">
      <div class="music-info">
        <h3>DJ F2</h3>
        <p class="artist">DJ F2</p>
        <audio controls class="song-audio">
          <source src="https://res.cloudinary.com/dsedfuptl/video/upload/v1778191854/DJ_F2_URBAN_RNB_POP_KIZOMBA_VIDEO_MIX_FT_JUSTIN_BIEBER__KHALID__ANNE_MARIE__CHRIS_BROWN__CARDI_B_128k_e2jk8r.mp4" type="audio/mp4">
        </audio>
        <button class="play-btn">Play Song</button>
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="music-card">
      <img src="https://i.pinimg.com/1200x/3f/8c/83/3f8c831b1d515cee268437e9f25863ac.jpg" alt="music">
      <div class="music-info">
        <h3>BEST OF VYBZ KARTEL & KONSHENS</h3>
        <p class="artist">Vybz Kartel, Konshens, Spice</p>
        <audio controls class="song-audio">
          <source src="https://res.cloudinary.com/dsedfuptl/video/upload/v1778192720/Best_Of_Vybz_Kartel_Mix_-_Dj_Trez___Rvssian__Spice__Konshens__fever_128k_ppxmf6.mp3" type="audio/mpeg">
        </audio>
        <button class="play-btn">Play Song</button>
      </div>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 MusicHub | Montie Carmon</p>
</footer>

<script>
  // Get all audio elements
  const allAudios = document.querySelectorAll('.song-audio');

  // Function to pause all audios except the one that should keep playing
  function pauseAllExcept(currentAudio) {
    allAudios.forEach(audio => {
      if (audio !== currentAudio && !audio.paused) {
        audio.pause();
      }
    });
  }

  // Add 'play' event listener to each audio – pauses others when this one starts
  allAudios.forEach(audio => {
    audio.addEventListener('play', function() {
      pauseAllExcept(this);
    });
  });

  // Handle the custom "Play Song" buttons
  const playButtons = document.querySelectorAll('.play-btn');
  playButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      // Find the audio element inside the same music-card
      const card = this.closest('.music-card');
      const audio = card.querySelector('.song-audio');
      // Pause all others, then play this one
      pauseAllExcept(audio);
      audio.play().catch(e => console.log("Play failed:", e));
    });
  });

  // Search functionality (unchanged, but adapted to show/hide cards properly)
  const searchInput = document.getElementById("searchInput");
  const musicCards = document.querySelectorAll(".music-card");

  searchInput.addEventListener("keyup", function() {
    const searchValue = searchInput.value.toLowerCase();
    musicCards.forEach(card => {
      const song = card.querySelector("h3").textContent.toLowerCase();
      const artist = card.querySelector(".artist").textContent.toLowerCase();
      if (song.includes(searchValue) || artist.includes(searchValue)) {
        card.style.display = "flex";
      } else {
        card.style.display = "none";
      }
    });
  });
</script>

</body>
</html>
